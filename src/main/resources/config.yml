# Install the same plugin on both Paper 26.2 servers.
# A bridge is an axis-aligned box. Entering it transfers the player.
check-interval-ticks: 5
transfer-cooldown-seconds: 5
messages:
  prefix: "<dark_aqua>[ServerBridge]</dark_aqua> "
  transferring: "<aqua>正在前往 <white><server></white>…</aqua>"
  no-permission: "<red>你沒有權限使用這個連接點。</red>"
  op-required: "<red>這個連接點只允許伺服器管理員使用。</red>"
  command-op-required: "<red>只有伺服器管理員能使用跨服指令。</red>"
  unknown-bridge: "<red>找不到連接點 <white><bridge></white>。</red>"
  reloaded: "<green>設定已重新載入。</green>"

# Example (remove enabled: false after editing):
bridges:
  survival-to-resource:
    enabled: false
    display-name: "資源世界"
    world: world
    # true: only OP players can use this bridge; false: regular players can use it.
    require-op: false
    region:
      min: { x: 100, y: 60, z: -5 }
      max: { x: 104, y: 70, z: 5 }
    destination:
      # native: Minecraft Transfer Protocol, using host and port.
      # velocity: Ask Velocity to switch backend servers. Use this even when Nginx is in front.
      mode: native
      host: resource.example.net
      port: 25566
      # Optional exact landing point on the destination server.
      arrival: { world: world, x: 0.5, y: 65, z: 0.5, yaw: 0, pitch: 0 }

  # Velocity example:
  survival-to-resource-via-proxy:
    enabled: false
    display-name: "代理資源世界"
    world: world
    require-op: true
    region:
      min: { x: 110, y: 60, z: -5 }
      max: { x: 114, y: 70, z: 5 }
    destination:
      mode: velocity
      # This is a Velocity backend name, not an Nginx upstream name.
      # Must exactly match a server key under "[servers]" in velocity.toml.
      # Velocity's accepts-transfers may remain false; this mode uses Connect messaging.
      server: resource
      arrival: { world: world, x: 0.5, y: 65, z: 0.5, yaw: 0, pitch: 0 }
